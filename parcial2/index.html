<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Óptica Mirasol</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Óptica Mirasol</h1>
    <p>
        En Óptica Mirasol te ayudamos a cuidar tu vista con exámenes
        profesionales, armazones de calidad y atención personalizada.
        Reservá tu cita y empezá a ver mejor.
    </p>
</header>

<main>

    <form id="form-cita" novalidate method="POST" action="procesar.php">

        <div class="campo">
            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" name="nombre" required>
        </div>

        <div class="campo">
            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" name="correo" required>
        </div>

        <div class="campo">
            <label for="consulta">Contanos qué necesitás:</label>
            <textarea id="consulta" name="consulta"></textarea>
        </div>

        <button type="submit">Pedir mi cita</button>

        <p id="aviso-cita" class="aviso"></p>

    </form>

</main>

<footer>
    <p>Parcial 2 - Madai Alejandra Monrroy Vega - 11 de agosto de 2026</p>
</footer>

<script src="script.js"></script>

</body>
</html>
